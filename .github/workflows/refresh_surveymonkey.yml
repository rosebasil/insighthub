name: Refresh SurveyMonkey survey data

# Scheduled export to durable storage the app can read: discovers new
# SurveyMonkey surveys (registered as drafts, never shown until a human
# sets their week_id/dashboard_id), refreshes response counts for known
# surveys, and commits data/surveys.json + data/refresh_meta.json back to
# the repo. No one edits data/surveys.json by hand for routine updates.
#
# NOT VERIFIED against a real account yet - see the warning at the top of
# modules/surveymonkey_client.py. This workflow is a no-op failure until
# the SURVEYMONKEY_ACCESS_TOKEN secret below is set; once it is, treat
# the first scheduled run as a test, not a production cutover.
#
# Requires this repository secret (Settings -> Secrets and variables ->
# Actions) - see README.md "Connecting real data sources" for exactly
# what to ask your SurveyMonkey admin for:
#   SURVEYMONKEY_ACCESS_TOKEN

on:
  schedule:
    - cron: "30 */6 * * *"  # every 6 hours, offset from the Snowflake job
  workflow_dispatch: {}     # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh script
        env:
          SURVEYMONKEY_ACCESS_TOKEN: ${{ secrets.SURVEYMONKEY_ACCESS_TOKEN }}
        run: python scripts/refresh_surveymonkey_data.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "jeeny-insights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/surveys.json data/refresh_meta.json
          git diff --cached --quiet || git commit -m "Automated: refresh SurveyMonkey survey data [skip ci]"
          git push
